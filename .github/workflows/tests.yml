name: Build Planner validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ["5.1", "5.4"]
    steps:
      - uses: actions/checkout@v6
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}
      - name: Validate standalone manifest and fonts
        run: python3 tests/check_structure.py
      - name: Verify source and test syntax
        run: |
          for file in Addon/WarriorCompanionBuild/*.lua tests/*.lua; do
            luac${{ matrix.lua }} -p "$file"
          done
      - name: Verify build planner rules
        run: lua${{ matrix.lua }} tests/test_build_planner.lua
      - name: Verify the 4-tab UI
        run: lua${{ matrix.lua }} tests/test_build_ui.lua
      - name: Verify quest log and segments
        run: lua${{ matrix.lua }} tests/test_quest_state.lua
      - name: Cross-check guide source IDs and coordinates
        run: python3 tests/test_guide_source_audit.py
      - name: Verify the 302-step adaptive guide
        run: lua${{ matrix.lua }} tests/test_detailed_guide.lua
      - name: Verify XP/Safety modes, optional detours and recovery
        run: lua${{ matrix.lua }} tests/test_adaptive_route.lua
      - name: Verify compass distances and protected values
        run: lua${{ matrix.lua }} tests/test_compass.lua
      - name: Verify minimap icon and original compact HUD
        run: lua${{ matrix.lua }} tests/test_mini_build.lua
      - name: Verify minimap startup and slash commands
        run: lua${{ matrix.lua }} tests/test_mini_core.lua
