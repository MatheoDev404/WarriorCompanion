name: Addon validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run structural check
        run: python3 tests/check_structure.py
      - name: Run Lua simulations
        run: lua5.4 tests/test_addon.lua
      - name: Verify syntax
        run: luac5.4 -p Addon/WarriorCompanion/*.lua tests/test_addon.lua
